app = 'smart-crm-backend'
primary_region = 'fra'

[build]
  dockerfile = "../Dockerfile"

[mounts]
  source = 'media_data'
  destination = '/data'

[env]
  MEDIA_ROOT = '/data/media'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
